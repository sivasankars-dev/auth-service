services:
  auth-service:
    build: .
    container_name: auth_api
    depends_on:
      - auth_db
    ports:
      - "8000:8000"
    env_file:
      - .env
    command: >
      uvicorn app.main:app
      --host 0.0.0.0
      --port 8000
      --reload
    
  auth_db:
    image: postgres:14
    container_name: auth_db
    restart: always
    env_file:
      - .env
    volumes:
      - auth_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      retries: 5

  alembic:
    build: .
    container_name: alembic_migration
    depends_on:
      auth_db:
        condition: service_healthy
    env_file:
      - .env
    command: >
      alembic upgrade head
    volumes:
      - .:/app
    working_dir: /app

volumes:
  auth_db_data: